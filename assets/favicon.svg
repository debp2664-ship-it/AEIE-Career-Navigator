<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Chip Housing -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#chipBg)" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.8" />

  <!-- IC Pins (Top, Bottom, Left, Right) -->
  <!-- Top Pins -->
  <line x1="20" y1="1" x2="20" y2="4" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="1" x2="32" y2="4" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="1" x2="44" y2="4" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" />

  <!-- Bottom Pins -->
  <line x1="20" y1="60" x2="20" y2="63" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="60" x2="32" y2="63" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="60" x2="44" y2="63" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" />

  <!-- Left Pins -->
  <line x1="1" y1="20" x2="4" y2="20" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" />
  <line x1="1" y1="32" x2="4" y2="32" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" />
  <line x1="1" y1="44" x2="4" y2="44" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" />

  <!-- Right Pins -->
  <line x1="60" y1="20" x2="63" y2="20" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="32" x2="63" y2="32" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="44" x2="63" y2="44" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" />

  <!-- Circuit Traces Inside Chip -->
  <path d="M12 18 H20 L26 26" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
  <circle cx="12" cy="18" r="1.5" fill="#00d2ff" />

  <path d="M52 18 H44 L38 26" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
  <circle cx="52" cy="18" r="1.5" fill="#00d2ff" />

  <path d="M12 46 H20 L26 38" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
  <circle cx="12" cy="46" r="1.5" fill="#00d2ff" />

  <path d="M52 46 H44 L38 38" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
  <circle cx="52" cy="46" r="1.5" fill="#00d2ff" />

  <!-- Central Silicon Die -->
  <rect x="20" y="20" width="24" height="24" rx="6" fill="url(#coreGlow)" filter="url(#glow)" />
  <rect x="22" y="22" width="20" height="20" rx="4" fill="#070e1e" />

  <!-- AEIE Acronym Core Symbol -->
  <text x="32" y="36.5" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#00d2ff" text-anchor="middle" letter-spacing="0.5">AEIE</text>
</svg>

