<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071226" />
      <stop offset="50%" stop-color="#0a1838" />
      <stop offset="100%" stop-color="#040b17" />
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad2)" />

  <!-- Microcontroller Board Illustration -->
  <g transform="translate(60, 45)">
    <!-- PCB Base -->
    <rect width="450" height="310" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <rect x="15" y="15" width="420" height="280" rx="10" fill="#042f2e" stroke="rgba(16, 185, 129, 0.4)" />

    <!-- MCU Chip (ATmega328P / STM32) -->
    <rect x="140" y="70" width="170" height="170" rx="8" fill="#0f172a" stroke="#00d2ff" stroke-width="2" />
    <text x="225" y="150" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" fill="#00d2ff" text-anchor="middle">ATmega328P</text>
    <text x="225" y="175" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">16 MHz • RISC Core</text>

    <!-- Chip Pins -->
    <g fill="#00d2ff">
      <!-- Left pins -->
      <rect x="122" y="90" width="18" height="6" rx="2" />
      <rect x="122" y="110" width="18" height="6" rx="2" />
      <rect x="122" y="130" width="18" height="6" rx="2" />
      <rect x="122" y="150" width="18" height="6" rx="2" />
      <rect x="122" y="170" width="18" height="6" rx="2" />
      <rect x="122" y="190" width="18" height="6" rx="2" />
      <rect x="122" y="210" width="18" height="6" rx="2" />
      <!-- Right pins -->
      <rect x="310" y="90" width="18" height="6" rx="2" />
      <rect x="310" y="110" width="18" height="6" rx="2" />
      <rect x="310" y="130" width="18" height="6" rx="2" />
      <rect x="310" y="150" width="18" height="6" rx="2" />
      <rect x="310" y="170" width="18" height="6" rx="2" />
      <rect x="310" y="190" width="18" height="6" rx="2" />
      <rect x="310" y="210" width="18" height="6" rx="2" />
    </g>

    <!-- Header Pins & Labels -->
    <rect x="30" y="30" width="390" height="24" rx="4" fill="#021c1a" />
    <text x="225" y="47" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" text-anchor="middle">GPIO • PWM • ADC • SPI • I2C (SDA/SCL)</text>

    <!-- Crystal Oscillator -->
    <rect x="200" y="255" width="50" height="20" rx="4" fill="#94a3b8" stroke="#475569" />
    <text x="225" y="269" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0f172a" text-anchor="middle">16.000</text>
  </g>

  <!-- Right: Digital Oscilloscope Screen -->
  <g transform="translate(560, 45)">
    <rect width="580" height="310" rx="14" fill="#050914" stroke="#00d2ff" stroke-width="2" />
    <rect x="15" y="15" width="550" height="40" rx="6" fill="#0b1329" />
    <text x="35" y="40" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#00d2ff">DIGITAL STORAGE OSCILLOSCOPE (DSO)</text>
    <text x="540" y="40" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981" text-anchor="end">RUN / 1.00 MSa/s</text>

    <!-- Screen Grid -->
    <g stroke="rgba(0, 210, 255, 0.12)" stroke-width="1">
      <line x1="25" y1="110" x2="555" y2="110" />
      <line x1="25" y1="160" x2="555" y2="160" />
      <line x1="25" y1="210" x2="555" y2="210" />
      <line x1="25" y1="260" x2="555" y2="260" />
      <line x1="110" y1="70" x2="110" y2="300" />
      <line x1="200" y1="70" x2="200" y2="300" />
      <line x1="290" y1="70" x2="290" y2="300" />
      <line x1="380" y1="70" x2="380" y2="300" />
      <line x1="470" y1="70" x2="470" y2="300" />
    </g>

    <!-- CH1: Analog Sensor Sine Wave -->
    <path d="M 35 185 Q 75 110, 115 185 T 195 185 T 275 185 T 355 185 T 435 185 T 515 185" fill="none" stroke="#f59e0b" stroke-width="3" />
    <!-- CH2: PWM Square Wave -->
    <path d="M 35 260 H 75 V 215 H 115 V 260 H 155 V 215 H 195 V 260 H 235 V 215 H 275 V 260 H 315 V 215 H 355 V 260 H 395 V 215 H 435 V 260 H 475 V 215 H 515" fill="none" stroke="#00d2ff" stroke-width="2.5" />

    <!-- Measurement Overlay -->
    <g transform="translate(30, 275)" font-family="'JetBrains Mono', monospace" font-size="11">
      <text x="10" y="20" fill="#f59e0b">CH1: Vpp=3.30V | Freq=1.00kHz</text>
      <text x="280" y="20" fill="#00d2ff">CH2: PWM Duty=65% | 490Hz</text>
    </g>
  </g>
</svg>

