<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1329" />
      <stop offset="50%" stop-color="#0e1a38" />
      <stop offset="100%" stop-color="#050a17" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad1)" />

  <!-- Grid Blueprint lines -->
  <g stroke="rgba(0, 210, 255, 0.08)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Left: C Programming Terminal Box -->
  <g transform="translate(60, 50)">
    <rect width="420" height="300" rx="10" fill="#050a14" stroke="rgba(0, 210, 255, 0.3)" stroke-width="1.5" />
    <!-- Terminal header -->
    <rect width="420" height="36" rx="10" fill="#0c172e" />
    <circle cx="24" cy="18" r="5" fill="#f43f5e" />
    <circle cx="40" cy="18" r="5" fill="#f59e0b" />
    <circle cx="56" cy="18" r="5" fill="#10b981" />
    <text x="80" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">main.c — GCC Compiler (AEIE Sem 1)</text>

    <!-- Code lines -->
    <g font-family="'JetBrains Mono', monospace" font-size="13" fill="#e2e8f0">
      <text x="24" y="70"><tspan fill="#38bdf8">#include</tspan> <tspan fill="#34d399">&lt;stdio.h&gt;</tspan></text>
      <text x="24" y="96"><tspan fill="#38bdf8">#include</tspan> <tspan fill="#34d399">&lt;stdlib.h&gt;</tspan></text>
      <text x="24" y="130"><tspan fill="#f43f5e">int</tspan> <tspan fill="#60a5fa">main</tspan>() {</text>
      <text x="48" y="156"><tspan fill="#94a3b8">// Read ADC analog sensor voltage</tspan></text>
      <text x="48" y="182"><tspan fill="#f43f5e">float</tspan> sensor_volt = read_channel(<tspan fill="#f59e0b">0</tspan>);</text>
      <text x="48" y="208">printf(<tspan fill="#34d399">"AEIE Lab: V = %.2f V\n"</tspan>, sensor_volt);</text>
      <text x="48" y="234"><tspan fill="#c084fc">return</tspan> <tspan fill="#f59e0b">0</tspan>;</text>
      <text x="24" y="260">}</text>
      <text x="24" y="290" fill="#10b981"><tspan fill="#00d2ff">git commit -m</tspan> "feat: sensor calibration module"</text>
    </g>
  </g>

  <!-- Center Connecting Circuit Trace -->
  <path d="M480 200 H550 L580 160 H640" fill="none" stroke="url(#cyanLine)" stroke-width="3" filter="url(#neon)" />
  <circle cx="480" cy="200" r="4" fill="#00d2ff" />
  <circle cx="640" cy="160" r="4" fill="#00d2ff" />

  <!-- Right: Electronic Circuit & Multimeter Testing -->
  <g transform="translate(660, 50)">
    <rect width="480" height="300" rx="10" fill="#050a14" stroke="rgba(0, 210, 255, 0.3)" stroke-width="1.5" />
    <rect width="480" height="36" rx="10" fill="#0c172e" />
    <text x="24" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#00d2ff">CIRCUIT ANALYSIS &amp; ELECTRONICS BENCH</text>

    <!-- Resistor & Capacitor schematic -->
    <g transform="translate(40, 70)" stroke="#38bdf8" stroke-width="2" fill="none">
      <!-- AC source -->
      <circle cx="40" cy="80" r="24" />
      <path d="M28 80 Q34 70 40 80 T52 80" />
      <line x1="40" y1="56" x2="40" y2="20" />
      <line x1="40" y1="20" x2="130" y2="20" />
      
      <!-- Resistor -->
      <path d="M130 20 L136 10 L144 30 L152 10 L160 30 L168 10 L174 20 H230" />
      <text x="140" y="5" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" stroke="none">R1 = 1kΩ</text>

      <!-- Capacitor -->
      <line x1="230" y1="20" x2="260" y2="20" />
      <line x1="260" y1="5" x2="260" y2="35" />
      <line x1="270" y1="5" x2="270" y2="35" />
      <line x1="270" y1="20" x2="330" y2="20" />
      <text x="250" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" stroke="none">C = 0.1μF</text>

      <!-- Return path -->
      <line x1="330" y1="20" x2="330" y2="140" />
      <line x1="330" y1="140" x2="40" y2="140" />
      <line x1="40" y1="140" x2="40" y2="104" />

      <!-- Ground -->
      <line x1="180" y1="140" x2="180" y2="160" />
      <line x1="168" y1="160" x2="192" y2="160" />
      <line x1="172" y1="166" x2="188" y2="166" />
      <line x1="176" y1="172" x2="184" y2="172" />
    </g>

    <!-- Digital Multimeter Badge -->
    <g transform="translate(50, 205)">
      <rect width="380" height="70" rx="8" fill="#071022" stroke="#1e293b" />
      <text x="20" y="28" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#94a3b8">DIGITAL MULTIMETER (DMM)</text>
      <text x="20" y="54" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#10b981">4.982 V <tspan font-size="13" fill="#64748b">RMS @ 50 Hz</tspan></text>
      <rect x="270" y="20" width="90" height="30" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" />
      <text x="315" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">CALIBRATED</text>
    </g>
  </g>
</svg>

