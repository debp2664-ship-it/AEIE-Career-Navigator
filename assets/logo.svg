<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="logoChipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050a17" />
    </linearGradient>
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (52x52) -->
  <g transform="translate(6, 6)">
    <rect x="2" y="2" width="48" height="48" rx="12" fill="url(#logoChipBg)" stroke="#00d2ff" stroke-width="1.8" />
    
    <!-- Microcontroller Pins -->
    <line x1="16" y1="0" x2="16" y2="2" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="26" y1="0" x2="26" y2="2" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="36" y1="0" x2="36" y2="2" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />

    <line x1="16" y1="50" x2="16" y2="52" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="26" y1="50" x2="26" y2="52" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="36" y1="50" x2="36" y2="52" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />

    <line x1="0" y1="16" x2="2" y2="16" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="0" y1="26" x2="2" y2="26" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="0" y1="36" x2="2" y2="36" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />

    <line x1="50" y1="16" x2="52" y2="16" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="50" y1="26" x2="52" y2="26" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="50" y1="36" x2="52" y2="36" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />

    <!-- Circuit traces -->
    <path d="M10 14 H18 L22 22" fill="none" stroke="#00d2ff" stroke-width="1.2" stroke-opacity="0.7" />
    <path d="M42 14 H34 L30 22" fill="none" stroke="#00d2ff" stroke-width="1.2" stroke-opacity="0.7" />
    <path d="M10 38 H18 L22 30" fill="none" stroke="#00d2ff" stroke-width="1.2" stroke-opacity="0.7" />
    <path d="M42 38 H34 L30 30" fill="none" stroke="#00d2ff" stroke-width="1.2" stroke-opacity="0.7" />

    <!-- Central Die -->
    <rect x="18" y="18" width="16" height="16" rx="4" fill="#00d2ff" fill-opacity="0.15" stroke="#00d2ff" stroke-width="1.2" />
    <text x="26" y="30" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" font-weight="900" fill="#00d2ff" text-anchor="middle">AEIE</text>
  </g>

  <!-- Typography: Name "AEIE Career Navigator" -->
  <text x="70" y="29" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="800" fill="#f8fafc" letter-spacing="0.8">
    <tspan fill="#00d2ff">AEIE</tspan> CAREER NAVIGATOR
  </text>
  
  <text x="70" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">
    UIT BURDWAN • BATCH 2026–2030
  </text>
</svg>

